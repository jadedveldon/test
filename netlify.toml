# Hosting on Netlify, with the content editor (see docs/editor.md).
# The secrets (the door word, and the sign-in settings) are set in Netlify's site settings, never here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  EDITOR_HOST = "netlify"
  NODE_VERSION = "22"

# Speed for returning visitors: the build's scripts, styles and fonts have their content's fingerprint in their names,
# so a browser may keep them for a year without asking again; a new build gives new names.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# link-preview cards and icons change rarely: kept a week, then checked again
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
